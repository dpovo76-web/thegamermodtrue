name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Compilar
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Resumen de errores
        if: failure()
        run: |
          {
            echo "## Errores de compilacion"
            echo '```'
            grep -E "error:|What went wrong|Could not|FAILED" -A4 build.log | head -150
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar log completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Guardar el mod compilado (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: gamersystem-jar
          path: build/libs/*.jar

      - name: Publicar Release con el .jar
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
